# Caddx Ascent Lite+ air (board 472): the gadget stock's config_serial.sh sets
# up (ACM only), on the Hi3516CV610's dwc3. KEEP is the serial port the
# updater answers on. fpvOS keeps fpvos-usb and these files in the app volume
# (/usrdata/fpv/air/usb): the stock rootfs is read-only.
GADGET=acm
UDC=10300000.dwc3
KEEP=acm.0
CHIP_DEV=/dev/arlink0
# The board id the bridge shows the host (docs/protocol.md, "Board ids").
BOARD=ascent-lite-plus
# The unit's name on USB; bridge mode shows "Caddx Ascent Lite+ (bridge)".
PRODUCT=Caddx Ascent Lite+
