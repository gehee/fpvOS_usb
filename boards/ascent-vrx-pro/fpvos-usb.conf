# Caddx VRX Pro goggle: the gadget S30usbgadget sets up (ECM + ACM), on the
# RK3568's dwc3. KEEP is the serial port the updater answers on.
GADGET=vrx
UDC=fcc00000.dwc3
KEEP=acm.usb0
CHIP_DEV=/dev/arlink0
# The board id the bridge shows the host (docs/protocol.md, "Board ids").
BOARD=ascent-vrx-pro
